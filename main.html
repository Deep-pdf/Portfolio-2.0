<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main-Screen</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="google-fonts.css">
</head>

<body>
    <main>
        <div class="simple-screen">
            <div class="bg">
                <img class="wall" src="Assets/xp.jpg" alt="">
            </div>
            <div class="taskbar">
                <div class="start-button">
                    <img class="start-logo" src="Assets/WindowsLogo-small.png" alt="">
                    <div class="start-text">start</div>
                    <div class="rectangle-button"></div>
                    <div class="oval-start"></div>
                </div>
                <div class="right-side">
                    <img class="volume" src="Assets/volume.png" alt="">
                    <img class="signal" src="Assets/signal.png" alt="">
                    <div class="time" id="time"></div>
                </div>
            </div>
            <div class="desktop" id="desktop">

                <!-- ICONS -->

                <div class="icon" style="top:20px; left:20px;">
                    <img src="Assets/My Computer.png">
                    <span>My Computer</span>
                </div>

                <div class="icon" style="top:120px; left:20px;">
                    <img src="Assets/Internet Explorer 6.png">
                    <span>Internet Explorer</span>
                </div>

                <div class="icon" style="top:220px; left:20px;">
                    <img src="Assets/My Documents.png">
                    <span>My Documents</span>
                </div>

                <div class="icon" style="top:320px; left:20px;">
                    <img src="Assets/Notepad.png">
                    <span>Notepad</span>
                </div>

                <div class="icon" style="top:420px; left:20px;">
                    <img src="Assets/Recycle Bin (full).png">
                    <span>Recycle Bin</span>
                </div>

                <div class="icon" style="top:520px; left:20px;">
                    <img src="Assets/Paint.png">
                    <span>Paint</span>
                </div>

                <div class="icon" style="top:20px; left:120px;">
                    <img src="Assets/Audio CD.png">
                    <span>Music</span>
                </div>

                <div class="icon" style="top:120px; left:120px;">
                    <img src="Assets/Email.png">
                    <span>Email</span>
                </div>

                <div class="icon" style="top:220px; left:120px;">
                    <img src="Assets/Windows Media Player 9.png">
                    <span>Media Player</span>
                </div>

                <div class="icon" style="top:320px; left:120px;">
                    <img src="Assets/Minesweeper.png">
                    <span>Minesweeper</span>
                </div>

            </div>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
