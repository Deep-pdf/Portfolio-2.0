<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main-Screen</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="google-fonts.css">
</head>

<body>
    <main>
        <div class="simple-screen">
            <div class="bg">
                <img class="wall" src="Assets/xp.jpg" alt="">
            </div>
            <div class="taskbar">
                <div class="start-button">
                    <img class="start-logo" src="Assets/WindowsLogo-small.png" alt="">
                    <div class="start-text">start</div>
                    <div class="rectangle-button"></div>
                    <div class="oval-start"></div>
                </div>
                <div class="right-side">
                    <img class="volume" src="Assets/volume.png" alt="">
                    <img class="signal" src="Assets/signal.png" alt="">
                    <div class="time" id="time"></div>
                </div>
            </div>
            <div class="desktop" id="desktop">

                <!-- ICONS -->

                <div class="icon" style="top:0px; left:0px;">
                    <img src="Assets/My Computer.png">
                    <span>My Computer</span>
                </div>

                <div class="icon" style="top:110px; left:0px;">
                    <img src="Assets/Internet Explorer 6.png">
                    <span>Internet Explorer</span>
                </div>

                <div class="icon" style="top:220px; left:0px;">
                    <img src="Assets/My Documents.png">
                    <span>My Documents</span>
                </div>

                <div class="icon" style="top:330px; left:00px;">
                    <img src="Assets/Notepad.png">
                    <span>Notepad</span>
                </div>

                <div class="icon" style="top:440px; left:00px;">
                    <img src="Assets/Recycle Bin (full).png">
                    <span>Recycle Bin</span>
                </div>

                <div class="icon" style="top:330px; left:110px;">
                    <img src="Assets/Paint.png">
                    <span>Paint</span>
                </div>

                <div class="icon" style="top:0px; left:110px;">
                    <img src="Assets/Audio CD.png">
                    <span>Music</span>
                </div>

                <div class="icon" style="top:110px; left:110px;">
                    <img src="Assets/Email.png">
                    <span>Email</span>
                </div>

                <div class="icon" style="top:220px; left:110px;">
                    <img src="Assets/Windows Media Player 9.png">
                    <span>Media Player</span>
                </div>

                <div class="icon" style="top:550px; left:0px;">
                    <img src="Assets/Minesweeper.png">
                    <span>Minesweeper`</span>
                </div>

                <div class="window">

                    <div class="titlebar">
                        <span>Minesweeper</span>

                        <div class="buttons">
                            <div class="win-btn"></div>
                            <div class="win-btn"></div>
                            <div class="win-btn close-btn" id="closeBtn">✕</div>
                        </div>
                    </div>

                    <div class="top-panel">

                        <div class="counter" id="mineCount">010</div>

                        <div class="face" id="resetBtn">🙂</div>

                        <div class="counter" id="timer">000</div>

                    </div>

                    <div class="board" id="board"></div>

                    <div class="info">
                        Left Click = Open • Right Click = Flag
                    </div>

                    <div class="overlay" id="overlay">
                        <div class="game-over">GAME OVER</div>
                        <button class="replay-btn" id="replayBtn">
                            Replay
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
