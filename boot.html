<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="google-fonts.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 0;
            margin: 0;
            min-width: 1024px;
            min-height: 600px;
        }

        .main {
            height: 100%;
            width: 100%;
            flex: 1;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bar {
            height: 10vh;
            width: 100%;
            background: #002c6a;
            z-index: 10;
            position: fixed;
            left: 0;
            right: 0;
        }

        .top {
            top: 0;
        }

        .bottom {
            bottom: 0;
        }

        .workarea {
            height: calc(100vh - 20vh);
            width: 100%;
            background:
                radial-gradient(circle at 15% 30%, rgba(255, 255, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(255, 255, 255, 0.12), transparent 45%),
                linear-gradient(135deg, #0063a5 0%, #0b74ba 100%);
            z-index: 1;
            position: fixed;
            top: 10vh;
            bottom: 10vh;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .Mline {
            width: 0.15vw;
            height: clamp(350px, 47vh, 570px);
            background: linear-gradient(to bottom,
                    transparent 0%,
                    white 40%,
                    white 60%,
                    transparent 100%);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .Tline {
            width: clamp(400px, 65vw, 750px);
            height: 1.2vh;
            background: white;
            -webkit-mask-image: radial-gradient(ellipse 60% 100% at center,
                    black 40%,
                    transparent 81%);
            mask-image: radial-gradient(ellipse 60% 100% at center,
                    black 40%,
                    transparent 81%);
            position: absolute;
            top: 0%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .Bline {
            width: clamp(400px, 65vw, 750px);
            height: 1.2vh;
            background: #EBAD00;
            -webkit-mask-image: radial-gradient(ellipse 60% 100% at center,
                    black 40%,
                    transparent 81%);
            mask-image: radial-gradient(ellipse 60% 100% at center,
                    black 40%,
                    transparent 81%);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .left-block {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .right-block {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            position: relative;
        }

        .logo-wrap {
            width: clamp(180px, 300px, 38%);
            height: 180px;
            font-size: clamp(10px, 22px, 1vw);
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            position: absolute;
            right: 10%;
            top: 23%;
            /* background: rgba(255, 255, 255, 0.1); */
        }

        .logo {
            width: 7em;
            object-fit: contain;
            position: absolute;
            left: 7.3em;
            top: 0em;
        }

        .microsoft {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.6em;
            color: white;
            position: absolute;
            top: 2.2em;
            left: 0%;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .Windows {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 3.5em;
            font-weight: 620;
            color: white;
            position: absolute;
            top: 1.35em;
            left: 0%;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .xp {
            font-family: 'CreatoDisplay-I';
            font-size: 2.2em;
            font-weight: 720;
            color: #ff8800;
            position: absolute;
            top: 2.2em;
            left: 6.8em;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .professional {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2.2em;
            color: white;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            position: absolute;
            top: 3.8em;
            left: 0.2em;
        }

        .begin-text {
            font-family: 'CreatoDisplay-L';
            color: white;
            position: absolute;
            top: 60%;
            right: 17%;
            text-shadow: 1px 2px 10px rgba(0, 0, 0, 0.35);
            font-size: clamp(1.2em, 2.5vw, 2vw);
        }

        .box-container {
            width: 70%;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 40px;
            padding: 0;
            /* background: rgba(0, 0, 0, 1); */
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .boxx {
            position: relative;
            width: 100%;
            height: 24%;

            

            /* fade out to the right */

            display: flex;
            align-items: center;
        }

        .bg {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            background: linear-gradient(135deg, #003C96 0%, #0063a5 100%);
            border: 1px solid rgba(255, 255, 255, 1);
            mask-image: linear-gradient(to right, black 10%, transparent 80%);
            -webkit-mask-image: linear-gradient(to right, black 10%, transparent 80%);
            opacity: 0;
            transition: opacity 0.1s ease-out;
        }

        .bg.active {
            opacity: 1;
        }

        .profile-frame {
            height: 75%;
            /* width: clamp(90px,200px,15%); */
            padding: 0 5px;
            background-color: #EBAD00;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            left: 20px;
        }

        .deep-photo {
            height: 90%;
            border-radius: 10px;
        }

        .admin-photo {
            height: 90%;
        }

        .pf2 {
            background-color: white;
        }

        .namee {
            color: white;
            font-family: 'CreatoDisplay-M';
            font-size: 25px;
            left: 40px;
            padding-left: 40px;
            padding-bottom: 40px;
            /* position: absolute; */
            z-index: 2;
        }

        .buttons-row{
            position: absolute;
            height: 32%;
            width: 60%;
            bottom: -15%;
            right: 10%;
            border-radius: 5px;
            /* background-color: yellow;
            border: black 1px solid; */
            display: flex;
            justify-content: space-between;
        }

        #pass-box{
            width: 70%;
            height: 100%;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 16px;
            resize: none;
            border-radius: 5px;
            
        }

        .help-box{
            height: 100%;
            aspect-ratio: 1/1;
            background-color: rgb(0, 3, 154);
            border: white 1px solid;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
        }

        .question-image{
            height: 60%;
        }


        .next-box{
            height: 100%;
            aspect-ratio: 1/1;
            background-color: green;
            border: white 1px solid;
            display: flex;
            justify-content: center;
            /* align-items: center; */
            border-radius: 5px;
        }

        @keyframes fadeInMaskLeftToRight {
            0% {
                opacity: 0;
                -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 100%);
                mask-image: linear-gradient(to right, transparent 0%, transparent 100%);
            }
            100% {
                opacity: 1;
                -webkit-mask-image: linear-gradient(to right, black 10%, transparent 80%);
                mask-image: linear-gradient(to right, black 10%, transparent 80%);
            }
        }

        .boxx {
            cursor: pointer;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 1600px) {

            .left-block,
            .right-block {
                width: 50%;
            }

            .namee {
                font-size: 20px;
            }
        }

        @media (max-width: 1024px) {
            body {
                min-width: auto;
            }

            .workarea {
                height: calc(100vh - 20vh);
                bottom: 10vh;
            }

            .left-block,
            .right-block {
                width: 100%;
                height: 100%;
                padding: 0;
            }


        }

        @media (max-width: 768px) {
            body {
                min-width: auto;
            }

            .workarea {
                height: calc(100vh - 20vh);
                bottom: 10vh;
                flex-direction: column;
            }

            .left-block,
            .right-block {
                width: 100%;
                height: 100%;
                padding: 0;
            }

            .Mline {
                width: 80vw;
                height: 1vw;
                background: linear-gradient(to right,
                        transparent 0%,
                        white 40%,
                        white 60%,
                        transparent 100%);
            }

            .logo-wrap {
                left: 55%;
                transform: translateX(-50%);
            }

            .begin-text {
                top: 65%;
                right: 50%;
                transform: translateX(50%);
                width: 240px;
            }

            .profile-frame {
                padding: 0 2px;
                left: 10px;
            }

            .boxx {
                height: 30%;
            }

            .bg{
                background: linear-gradient(135deg, #003C96 60%, #0063a5 100%);
            }
            
        }
    </style>

</head>

<body>
    <div class="main">
        <div class="top bar"></div>
        <div class="workarea">
            <div class="Tline"></div>
            <div class="Mline"></div>
            <div class="Bline"></div>

            <div class="left-block">
                <div class="logo-wrap">
                    <img src="Assets/MS logo.png" alt="" class="logo" />
                    <p class="text microsoft">Microsoft</p>
                    <p class="text Windows">Windows</p>
                    <p class="text xp">xp</p>
                    <p class="text professional">Professional</p>
                </div>
                <div class="begin-text">
                    <p>To begin, click the user name</p>
                </div>
            </div>

            <div class="right-block">
                <div class="box-container">
                    <div class="box1 boxx">
                        <div class="bg"></div>
                        <div class="profile-frame">
                            <img class="deep-photo" src="Assets/profileeee.jpeg" alt="">
                        </div>
                        <div class="namee">Soumodeep Santra</div>
                    </div>
                    <div class="box2 boxx">
                        <div class="bg"></div>
                        <div class="profile-frame pf2">
                            <img class="admin-photo" src="Assets/admin.png" alt="">
                        </div>
                        <div class="namee">Adminstrator</div>
                        <div class="buttons-row">
                            <textarea name="" id="pass-box"></textarea>
                            <div class="next-box"><img src="Assets/next.png" alt=""></div>
                            <div class="help-box"><img class="question-image" src="Assets/question.png" alt=""></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <div class="bottom bar"></div>
    </div>

    <script>
        const boxes = document.querySelectorAll('.boxx');
        let activeBox = document.querySelector('.box1');
        let activeBg = activeBox.querySelector('.bg');
        activeBg.classList.add('active');

        boxes.forEach(box => {
            box.addEventListener('mouseenter', () => {
                const bg = box.querySelector('.bg');
                
                if (activeBox !== box) {
                    // Clear animation from previous box
                    activeBg.style.animation = 'none';
                    activeBg.classList.remove('active');
                    
                    // Set new active box
                    activeBox = box;
                    activeBg = bg;
                    
                    // Trigger animation on new box
                    bg.style.animation = 'none';
                    setTimeout(() => {
                        bg.style.animation = 'fadeInMaskLeftToRight 0.1s ease-out forwards';
                        bg.classList.add('active');
                    }, 10);
                }
            });
        });
    </script>
</body>

</html>
