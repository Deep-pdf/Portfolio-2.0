<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio 2.0</title>
  <!--
    preloader.css is inlined inside styles.css.
    The #preloader overlay styles live at the top of styles.css.
  -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!--
    ============================================================
    #preloader — Fullscreen preloader overlay
    ============================================================
    • Fixed fullscreen, high z-index (set in CSS)
    • Holds the existing Windows XP loading-screen design
    • JavaScript adds .preloader--fade-out to trigger dismissal
    ============================================================
  -->
  <div id="preloader" role="status" aria-label="Loading, please wait…">

    <main class="viewport" aria-label="Windows XP Professional loading screen">
      <section class="figma-frame" data-node-id="2002:2" data-name="Loading Screen">
        <div class="logo-wrap" data-node-id="2007:3" data-name="MS logo 1">
          <img src="Assets/MS logo.png" alt="" class="logo" />
        </div>

        <p class="text microsoft" data-node-id="2002:4">Microsoft</p>
        <p class="text windows"   data-node-id="2002:6">Windows</p>
        <p class="text professional" data-node-id="2002:7">Professional</p>
        <p class="text xp"        data-node-id="2006:2">xp</p>

        <div class="loader">
          <div class="slider">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
          </div>
        </div>

      </section>
    </main>

  </div><!-- /#preloader -->

  <!--
    preloader.js handles:
      • Responsive Figma-frame scaling (replaces script.js)
      • Scroll lock / unlock
      • 3-second minimum display timer
      • window "load" detection (all assets including images/fonts/video)
      • Smooth cinematic fade-out
      • Redirect to boot.html
    Placed at end of <body> so DOM is ready when the script runs.
  -->
  <script src="preloader.js"></script>
</body>

</html>
